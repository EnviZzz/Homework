<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALIFORNIA</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <header class="header">
        <div class="container header__container">
            <a class="header__logo" href="#">
                <img width="170px" height="21px" class="logo__amg" src="./logo/logo.svg" alt="">
            </a>
            <ul class="menu header__list">
                <li class="header__item"><a class="menu__link" href="">all products</a></li>
                <li class="header__item"><a class="menu__link" href="">Solutions <img src="./logo/arrow.svg" alt=""></a></li>
                <li class="header__item"><a class="menu__link" href="">About</a></li>
                <li class="header__item"><a class="menu__link" href="">Support</a></li>
            </ul>
            <div class="header__actions">
            <button
              class="header__actions-button"
              title="Поиск"
              aria-label="Поиск"
            >
              <svg width="24" height="24">
                <use
                  class="header__actions-icon"
                  href="./logo/sprite.svg#search"
                ></use>
              </svg>
            </button>
            <button
              class="header__actions-button"
              title="Корзина"
              aria-label="Корзина"
            >
              <svg width="24" height="24">
                <use
                  class="header__actions-icon"
                  href="./logo/sprite.svg#cart"
                ></use>
              </svg>
            </button>
            </div>
        </div>
    </header>
</body>
</html>
